name: Build and Release (Windows)

on:
  push:
    branches: [ main ]
    tags: ['v*']

jobs:
  build:
    name: Build Windows binary (cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build App.exe
        run: |
          x86_64-w64-mingw32-gcc App.c -o App.exe -lwinmm -lcomdlg32 -luser32 || true
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-windows
          path: App.exe

  release:
  release:
    name: Create GitHub Release (on tag)
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Find Visual Studio and set up build variables
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath"`) do set VSINSTALL=%%i
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x64
      - name: Build with MSVC
        shell: cmd
        run: |
          cl /nologo /EHsc App.cpp /link winmm.lib comdlg32.lib user32.lib /OUT:App.exe
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./App.exe
          asset_name: App.exe
          asset_content_type: application/octet-stream
